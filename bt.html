<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impronte Artigiane - Ricerca Batterie</title>
    <link rel="stylesheet" href="bt.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-left">
            <div id="mySidenav" class="sidenav">
                <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
                <div class="sidenav-header">Menu</div>
                <a href="Ordini.html"><i class="fa-solid fa-list-check"></i> Ordini</a>
                <a href="Listino prezzi.html"><i class="fa-solid fa-tags"></i> Listino prezzi</a>
                <a href="bt.html"><i class="fa-solid fa-battery-three-quarters"></i> Batterie</a>
            </div>
            <span onclick="openNav()"><i class="fas fa-bars menu-btn"></i></span>
        </div>
        <div class="header-right">
            <a href="index.html"><button class="btn-home"><i class="fa-solid fa-house"></i></button></a>
        </div>
    </header>

    <main class="main-content">
        <div class="container-search">
            <div class="icon-circle">
                <i class="fa-solid fa-battery-bolt"></i>
            </div>
            <h1>Ricerca Batteria</h1>
            <p>Inserisci il codice presente sulla batteria per trovare il corrispettivo AG.</p>
            
            <div class="search-box">
                <label for="nomeBatteria">Codice Batteria</label>
                <input type="text" id="nomeBatteria" placeholder="es. SR621SW o 364..." onkeyup="if(event.keyCode===13) cercaBatteria()">
                <button onclick="cercaBatteria()" id="btn-cerca">CERCA CORRISPETTIVO</button>
            </div>

            <div id="risultato" class="result-box"></div>
        </div>
    </main>

    <script src="bt.js"></script>
</body>
</html>
